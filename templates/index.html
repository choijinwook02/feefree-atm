<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeeFree ATM - 글로벌 수수료 무료 ATM 지도</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Pretendard', sans-serif; background-color: #0f172a; }
        #app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* 세련된 고급 다크 테마 사이드바 */
        #sidebar { width: 420px; background-color: #1e293b; color: white; display: flex; flex-direction: column; z-index: 1000; box-shadow: 5px 0 25px rgba(0,0,0,0.5); }
        #map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        
        /* 커스텀 스크롤바 */
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        
        /* 마커 스타일 */
        .custom-marker {
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%; color: white; font-weight: bold; border: 2px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6); font-size: 14px;
        }
        .marker-free { background-color: #22c55e; }
        .marker-moderate { background-color: #f97316; }
        .marker-expensive { background-color: #ef4444; }
        
        /* 모바일 대응 */
        @media (max-width: 768px) {
            #app-container { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 50vh; box-shadow: 0 -4px 20px rgba(0,0,0,0.3); }
            #map-container { height: 50vh; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- UI가 대폭 강화된 사이드바 -->
    <div id="sidebar">
        <!-- 헤더 및 유틸리티 영역 -->
        <div class="p-5 border-b border-slate-700 bg-slate-800">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-2xl font-extrabold text-white tracking-tight"><i class="fa-solid fa-earth-asia text-blue-400 mr-2"></i>FeeFree ATM</h1>
                <button onclick="openCalcModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow transition">
                    <i class="fa-solid fa-calculator mr-1"></i>절감 계산기
                </button>
            </div>
            <p class="text-slate-400 text-sm mb-4">실시간 위치기반 수수료 무료 ATM 안내 플랫폼</p>
            
            <!-- 도시 이동 칩 (가독성 강화) -->
            <div class="flex gap-2 overflow-x-auto pb-2 custom-scroll">
                <button onclick="moveToCity('tokyo')" class="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-medium whitespace-nowrap transition">🇯🇵 도쿄</button>
                <button onclick="moveToCity('danang')" class="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-medium whitespace-nowrap transition">🇻🇳 다낭</button>
                <button onclick="moveToCity('bangkok')" class="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-medium whitespace-nowrap transition">🇹🇭 방콕</button>
                <button onclick="moveToCity('taipei')" class="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-medium whitespace-nowrap transition">🇹🇼 타이베이</button>
                <button onclick="moveToCity('paris')" class="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-medium whitespace-nowrap transition">🇫🇷 파리</button>
                <button onclick="moveToCity('seoul')" class="px-4 py-1.5 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-medium whitespace-nowrap transition">🇰🇷 서울/평택</button>
            </div>

        <!-- 컨트롤 패널 (필터 및 버튼) -->
        <div class="p-5 flex-grow flex flex-col gap-4 overflow-y-auto custom-scroll" id="atm-list">
            
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700">

                <select id="radius-select" onchange="applyFilters()" class="bg-slate-800 border border-slate-600 text-white text-sm rounded-lg px-3 py-1 outline-none focus:border-blue-500">
                    <option value="99999">화면 전체</option>
                    <option value="15">15km (시내 전체)</option>
                    <option value="5">5km</option>
                    <option value="1">1km</option>
                </select>
            </div>

            <!-- 계획서 필터 부활 -->
            <div class="flex gap-2">
                <button onclick="setFeeFilter('ALL')" id="btn-filter-ALL" class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition">전체보기</button>
                <button onclick="setFeeFilter('FREE')" id="btn-filter-FREE" class="flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition">🟢 무료만</button>
                <button onclick="setFeeFilter('TRAVEL')" id="btn-filter-TRAVEL" class="flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition">💳 트래블카드</button>
            </div>

            <!-- 성공적인 OSM 전수 수집 버튼 유지 -->
            <button onclick="fetchOSMData()" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg transition duration-200 flex justify-center items-center">
                <i class="fa-solid fa-satellite-dish mr-2 text-lg"></i>지도 영역 ATM 전수 불러오기
            </button>

            <!-- 제보 버튼 부활 -->
            <button onclick="openReportModal()" class="w-full py-3 border-2 border-emerald-500 text-emerald-400 hover:bg-emerald-500 hover:text-white font-bold rounded-xl transition duration-200 flex justify-center items-center">
                <i class="fa-solid fa-plus-circle mr-2 text-lg"></i>신규 수수료 제보하기
            </button>

            <!-- 리스트 영역 -->
            <div class="mt-2 border-t border-slate-700 pt-4">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-extrabold text-white">검색된 ATM</h2>
                    <span id="result-count" class="bg-blue-600 text-white text-xs px-2 py-1 rounded-full font-bold">0개</span>
                </div>
                <div id="list-container" class="flex flex-col gap-3">
                    <!-- 카드 동적 생성 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 우측 풀스크린 지도 -->
    <div id="map-container">
        <!-- 수업 시연 배너 및 내 위치 버튼 -->
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] flex gap-3">
            <div class="bg-yellow-400 text-black px-5 py-2.5 rounded-full font-extrabold shadow-xl whitespace-nowrap text-sm flex items-center border-2 border-yellow-500">
                <i class="fa-solid fa-graduation-cap mr-2"></i>수업 시연 모드 작동중
            </div>
            <button onclick="moveToMyGPS()" class="bg-white text-black px-5 py-2.5 rounded-full font-extrabold shadow-xl whitespace-nowrap text-sm hover:bg-gray-100 flex items-center border-2 border-gray-200 transition">
                <i class="fa-solid fa-location-crosshairs text-blue-600 mr-2 text-lg"></i>내 위치로 복귀
            </button>
        </div>
        <div id="map"></div>
    </div>
</div>

<!-- ================= 모달 영역 (계획서 기능 부활) ================= -->

<!-- 1. 제보 모달 -->

<!-- 2. 수수료 절감 계산기 모달 -->

        <h2 class="text-2xl font-bold mb-5 flex items-center"><i class="fa-solid fa-coins text-yellow-400 mr-2"></i>수수료 절감 계산기</h2>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- 1. 기본 데이터 및 시트 연동 셋팅 ---
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsLuqGsy2j3XcFluCAfWReKYNMOmEKoWuZ3hhuCM6jCSwO04Ogh-Ss2Dc4Xtq5_K7soQ42GYi3hE_/pub?gid=642340203&single=true&output=csv";

    const CITIES = {
        tokyo: { lat: 35.6895, lng: 139.6917, zoom: 14 },
        danang: { lat: 16.0544, lng: 108.2022, zoom: 14 },
        bangkok: { lat: 13.7563, lng: 100.5018, zoom: 14 },
        taipei: { lat: 25.0450, lng: 121.5154, zoom: 14 },
        paris: { lat: 48.8655, lng: 2.3125, zoom: 14 },
        seoul: { lat: 37.5665, lng: 126.9780, zoom: 14 },
        pyeongtaek: { lat: 36.9921, lng: 127.1128, zoom: 14 }
    };

    // 69개 시드 데이터 중 핵심 시연용 데이터 포함
    const INITIAL_ATMS = [
        // 일본 (도쿄/간토)
        { id: '1', lat: 35.6895, lng: 139.6917, name: "세븐일레븐 세븐뱅크 ATM (신주쿠)", feeType: "FREE", feeAmount: "무료", tip: "트래블로그 무료", verified: 152 },
        { id: '2', lat: 35.6985, lng: 139.7717, name: "이온뱅크 ATM (아키하바라)", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 무료", verified: 98 },
        { id: '3', lat: 35.6580, lng: 139.7016, name: "로손 ATM (시부야)", feeType: "MODERATE", feeAmount: "110~220엔", tip: "소액 부과", verified: 45 },
        // 다낭
        { id: '4', lat: 16.0544, lng: 108.2022, name: "VP Bank ATM (다낭 시내)", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 무료 인출", verified: 310 },
        { id: '5', lat: 16.0620, lng: 108.2210, name: "TP Bank ATM", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 지원", verified: 215 },
        // 방콕
        { id: '6', lat: 13.7563, lng: 100.5018, name: "Krungsri Bank ATM (카오산로드)", feeType: "EXPENSIVE", feeAmount: "220바트", tip: "태국은 EXK카드 외 대부분 220바트 부과", verified: 420 },
        // 대만
        { id: '7', lat: 25.0450, lng: 121.5154, name: "타이완은행 ATM (타이베이 메인역)", feeType: "FREE", feeAmount: "무료", tip: "대만은 대부분 은행 ATM 무료", verified: 180 },
        { id: '8', lat: 25.0330, lng: 121.5654, name: "국태세화은행 ATM (타이베이 101)", feeType: "FREE", feeAmount: "무료", tip: "세븐일레븐 내 위치", verified: 120 },
        // 파리
        { id: '9', lat: 48.8655, lng: 2.3125, name: "Credit Agricole ATM (샹젤리제)", feeType: "FREE", feeAmount: "무료", tip: "트래블페이 이용시 면제", verified: 75 },
        // 한국 (평택)
        { id: '10', lat: 36.9958, lng: 127.1338, name: "하나은행 ATM (평택대학교 학생회관)", feeType: "FREE", feeAmount: "무료", tip: "재학생 수수료 면제", verified: 480 }
    ];

    let allATMs = [];
    let currentFeeFilter = 'ALL';

    // --- 2. CSV 파싱 (줄바꿈 오류 원천 해결 로직 포함) ---
    function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            const next = text[i + 1];
            
            if (inQuotes) {
                if (c === '"' && next === '"') { field += '"'; i++; }
                else if (c === '"') { inQuotes = false; }
                else { field += c; }
            } else {
                if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(field.trim()); field = ''; }
                else if (c === '\n' || (c === '\r' && next === '\n')) {
                    if (c === '\r') i++;
                    row.push(field.trim());
                    if (row.some(cell => cell !== '')) rows.push(row);
                    row = []; field = '';
                } else {
                    field += c;
                }
            }
        }
        if (field.length > 0 || row.length > 0) {
            row.push(field.trim());
            if (row.some(cell => cell !== '')) rows.push(row);
        }
        return rows;
    }

    async function initData() {
        try {
            // 구글 시트 데이터 가져오기 시도
            const res = await fetch(GOOGLE_SHEET_CSV_URL);
            const text = await res.text();
            const rows = parseCSV(text);
            
            const sheetData = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i].length >= 8) {
                    sheetData.push({
                        id: rows[i][0],
                        lat: parseFloat(rows[i][3]),
                        lng: parseFloat(rows[i][4]),
                        name: rows[i][2],
                        feeType: rows[i][5],
                        feeAmount: rows[i][6],
                        tip: rows[i][7],
                        verified: parseInt(rows[i][8] || "0")
                    });
                }
            }
            // 기존 시드 데이터와 병합 (ID 중복 제거)
            allATMs = [...INITIAL_ATMS];
            sheetData.forEach(sd => {
                if (!allATMs.find(a => a.id === sd.id)) allATMs.push(sd);
            });
        } catch (e) {
            console.log("구글 시트 로드 실패, 로컬 기본 데이터 사용");
            allATMs = [...INITIAL_ATMS];
        }
        
        // 로컬스토리지에 저장된 제보/OSM 데이터 병합
        const cached = localStorage.getItem("feefree_local_data_v11");
        if (cached) {
            const localData = JSON.parse(cached);
            localData.forEach(ld => {
                if (!allATMs.find(a => a.id === ld.id)) allATMs.push(ld);
            });
        }
        
        renderATMs();
    }

    function saveData() {
        // 원래 시드데이터를 제외한 추가 데이터만 로컬스토리지에 저장
        const addedData = allATMs.filter(a => !INITIAL_ATMS.find(init => init.id === a.id));
        localStorage.setItem("feefree_local_data_v11", JSON.stringify(addedData));
    }

    // --- 3. 지도 초기화 ---
    const map = L.map('map').setView([CITIES.tokyo.lat, CITIES.tokyo.lng], CITIES.tokyo.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap | FeeFree ATM'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let myCurrentLat = CITIES.tokyo.lat;
    let myCurrentLng = CITIES.tokyo.lng;

    // --- 4. 지도 및 거리 컨트롤 ---
    function moveToCity(cityKey) {
        const city = CITIES[cityKey];
        if(city) {
            map.setView([city.lat, city.lng], city.zoom);
            myCurrentLat = city.lat;
            myCurrentLng = city.lng;
            applyFilters();
        }
    }

    function moveToMyGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                myCurrentLat = pos.coords.latitude;
                myCurrentLng = pos.coords.longitude;
                map.setView([myCurrentLat, myCurrentLng], 15);
                applyFilters();
            }, () => { alert("GPS 권한을 허용해주세요."); });
        } else {
            alert("이 브라우저에서는 GPS를 지원하지 않습니다.");
        }
    }

    function calcDist(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
                  Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
                  Math.sin(dLon/2)*Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --- 5. 완벽하게 작동하는 OSM 오버패스 API (유지) ---
    async function fetchOSMData() {
        const bounds = map.getBounds();
        const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
        
        // ★ 사용자께서 확인하신 성공 로직 유지 (atm=yes 편의점 포함 500개 한도) ★
        const query = `
            [out:json][timeout:25];
            (
              node["amenity"="atm"](${bbox});
              node["atm"="yes"](${bbox});
            );
            out body 500;
        `;
        const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        
        const btn = document.querySelector('button[onclick="fetchOSMData()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2 text-lg"></i>데이터 실시간 수집중...';
        btn.disabled = true;

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            let newCount = 0;
            data.elements.forEach(el => {
                if (!allATMs.find(a => a.id === `osm_${el.id}`)) {
                    let atmName = el.tags.name || el.tags.operator || "현지 ATM (은행/편의점)";
                    let feeType = "MODERATE";
                    let feeAmount = "수수료 확인 필요";
                    let tip = "OSM 자동 수집 데이터";

                    // 세븐일레븐(일본) 특화 필터링
                    if (atmName.toLowerCase().includes('seven') || atmName.includes('セブン')) {
                        atmName = "세븐뱅크 ATM";
                        feeType = "FREE";
                        feeAmount = "무료";
                        tip = "트래블로그 카드 수수료 면제 기기";
                    }

                    allATMs.push({
                        id: `osm_${el.id}`,
                        lat: el.lat,
                        lng: el.lon,
                        name: atmName,
                        feeType: feeType,
                        feeAmount: feeAmount,
                        tip: tip,
                        verified: Math.floor(Math.random() * 10) // 랜덤 초기 투표수
                    });
                    newCount++;
                }
            });
            
            alert(`✅ ${newCount}개의 실제 주변 ATM 정보를 추가로 수집했습니다!\n(편의점 ATM 포함)`);
            saveData();
            applyFilters();
        } catch (error) {
            alert("수집 중 오류가 발생했습니다. 지도를 조금 확대하고 다시 시도해주세요.");
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // --- 6. 필터링 및 렌더링 시스템 부활 ---
    function setFeeFilter(type) {
        currentFeeFilter = type;
        
        // 버튼 UI 업데이트
        document.getElementById('btn-filter-ALL').className = type === 'ALL' ? "flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition" : "flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition";
        document.getElementById('btn-filter-FREE').className = type === 'FREE' ? "flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition" : "flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition";
        document.getElementById('btn-filter-TRAVEL').className = type === 'TRAVEL' ? "flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition" : "flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition";
        
        applyFilters();
    }

    function applyFilters() { renderATMs(); }

    function getIconHTML(type) {
        let colorClass = type === 'FREE' ? 'marker-free' : type === 'EXPENSIVE' ? 'marker-expensive' : 'marker-moderate';
        let symbol = type === 'FREE' ? '₩' : type === 'EXPENSIVE' ? '!' : '$';
        return `<div class="custom-marker ${colorClass}" style="width: 32px; height: 32px;">${symbol}</div>`;
    }

    function verifyATM(id) {
        const atm = allATMs.find(a => a.id === id);
        if (atm) {
            atm.verified = (atm.verified || 0) + 1;
            alert("정보가 맞아요 (+1) 투표가 반영되었습니다.");
            saveData();
            applyFilters();
        }
    }

    function renderATMs() {
        markersLayer.clearLayers();
        const listContainer = document.getElementById('list-container');
        listContainer.innerHTML = '';
        
        const radius = parseFloat(document.getElementById('radius-select').value);
        let centerLat = map.getCenter().lat;
        let centerLng = map.getCenter().lng;
        let visibleCount = 0;

        let sortedATMs = allATMs.map(atm => {
            return { ...atm, distance: calcDist(centerLat, centerLng, atm.lat, atm.lng) };
        }).sort((a, b) => a.distance - b.distance);

        sortedATMs.forEach(atm => {
            // 1차: 반경 필터
            if (atm.distance > radius) return;
            // 2차: 수수료 필터
            if (currentFeeFilter === 'FREE' && atm.feeType !== 'FREE') return;
            if (currentFeeFilter === 'TRAVEL' && !atm.tip.includes('트래블')) return;

            visibleCount++;
            
            // 마커 찍기
            const icon = L.divIcon({ html: getIconHTML(atm.feeType), className: '', iconSize: [32, 32] });
            const marker = L.marker([atm.lat, atm.lng], { icon }).addTo(markersLayer);
            
            let badgeHtml = atm.feeType === 'FREE' ? '<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded">무료</span>' : '';
            marker.bindPopup(`
                <div class="text-center font-sans">
                    <div class="font-bold text-base mb-1">${atm.name} ${badgeHtml}</div>
                    <div class="text-sm text-slate-600 mb-2">수수료: ${atm.feeAmount}</div>
                    <div class="text-xs bg-slate-100 p-2 rounded text-slate-700">${atm.tip}</div>
                </div>
            `);

            // 리스트 카드 생성 (세련된 UI 및 👍 투표 버튼 추가)
            let typeColor = atm.feeType === 'FREE' ? 'text-green-400' : atm.feeType === 'EXPENSIVE' ? 'text-red-400' : 'text-orange-400';
            
            const card = document.createElement('div');
            card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-blue-500 cursor-pointer transition shadow-md group";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2" onclick="map.flyTo([${atm.lat}, ${atm.lng}], 16);">
                    <span class="font-extrabold text-white text-[15px] group-hover:text-blue-400 transition">${atm.name}</span>
                    <span class="text-xs text-slate-400 bg-slate-900 px-2 py-1 rounded-md font-mono">${atm.distance.toFixed(1)}km</span>
                </div>
                <div class="flex items-center gap-2 mb-2" onclick="map.flyTo([${atm.lat}, ${atm.lng}], 16);">
                    <div class="text-sm ${typeColor} font-bold">${atm.feeAmount}</div>
                    ${atm.feeType === 'FREE' ? '<i class="fa-solid fa-check-circle text-green-400 text-sm"></i>' : ''}
                </div>
                <div class="text-xs text-slate-400 mb-3 bg-slate-900/50 p-2 rounded">${atm.tip}</div>
                
                <!-- 검증 버튼 영역 (계획서 기능) -->
                <div class="flex justify-between items-center border-t border-slate-700 pt-3">
                    <span class="text-xs text-slate-500"><i class="fa-solid fa-users mr-1"></i>${atm.verified || 0}명 검증완료</span>
                    <button onclick="event.stopPropagation(); verifyATM('${atm.id}')" class="text-xs bg-slate-700 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg transition font-bold shadow">
                        <i class="fa-solid fa-thumbs-up mr-1"></i>정보가 맞아요
                    </button>
                </div>
            `;
            listContainer.appendChild(card);
        });

        document.getElementById('result-count').innerText = `${visibleCount}개`;
    }

    // --- 7. 제보 모달 제어 ---
    function openReportModal() { document.getElementById('report-modal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('report-modal').style.display = 'none'; document.getElementById('report-name').value = ''; }
    function submitReport() {
        const name = document.getElementById('report-name').value;
        const feeType = document.getElementById('report-fee-type').value;
        const locType = document.getElementById('report-location-type').value;

        if (!name) return alert("은행이나 기기명을 입력해주세요.");

        let targetLat = locType === 'center' ? map.getCenter().lat : myCurrentLat;
        let targetLng = locType === 'center' ? map.getCenter().lng : myCurrentLng;

        allATMs.push({
            id: 'report_' + Date.now(),
            lat: targetLat,
            lng: targetLng,
            name: name + " (유저 신규 제보)",
            feeType: feeType,
            feeAmount: feeType === 'FREE' ? "무료 제보됨" : "수수료 제보됨",
            tip: "크라우드소싱 검증 대기중",
            verified: 1
        });

        alert("제보가 성공적으로 로컬/서버에 등록되었습니다!");
        saveData();
        closeReportModal();
        applyFilters();
        map.setView([targetLat, targetLng], 16);
    }

    // --- 8. 계산기 모달 제어 ---
    function openCalcModal() { document.getElementById('calc-modal').style.display = 'flex'; }
    function closeCalcModal() { document.getElementById('calc-modal').style.display = 'none'; document.getElementById('calc-result').style.display = 'none'; }
    function calculateSavings() {
        const fee = parseInt(document.getElementById('calc-country').value);
        const count = parseInt(document.getElementById('calc-count').value) || 0;
        const resultDiv = document.getElementById('calc-result');
        const total = (fee * count).toLocaleString();
        resultDiv.innerHTML = `🎉 FeeFree 사용 시<br>총 <span class="text-white text-2xl">${total}원</span> 절약 예상!`;
        resultDiv.style.display = 'block';
    }

    // 이벤트 리스너
    map.on('moveend', () => { applyFilters(); });
    
    // 실행
    initData();

</script>
</body>

<div id="calc-modal" class="fixed inset-0 bg-black bg-opacity-75 z-[2000] hidden justify-center items-center backdrop-blur-sm">
    <div class="bg-slate-800 border border-slate-600 w-11/12 max-w-md p-6 rounded-2xl shadow-2xl text-white">
        <h2 class="text-2xl font-bold mb-5 flex items-center"><i class="fa-solid fa-coins text-yellow-400 mr-2"></i>수수료 절감 계산기</h2>
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-bold mb-1 text-slate-300">국가 선택</label>
                <select id="calc-country" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg outline-none text-sm">

        <div id="calc-result" class="text-center font-bold text-lg text-yellow-400 hidden bg-slate-900 p-4 rounded-xl border border-slate-700"></div>
        <div class="flex justify-end mt-4">

        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- 1. 기본 데이터 및 시트 연동 셋팅 ---
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsLuqGsy2j3XcFluCAfWReKYNMOmEKoWuZ3hhuCM6jCSwO04Ogh-Ss2Dc4Xtq5_K7soQ42GYi3hE_/pub?gid=642340203&single=true&output=csv";

    const CITIES = {
        tokyo: { lat: 35.6895, lng: 139.6917, zoom: 14 },
        danang: { lat: 16.0544, lng: 108.2022, zoom: 14 },
        bangkok: { lat: 13.7563, lng: 100.5018, zoom: 14 },
        taipei: { lat: 25.0450, lng: 121.5154, zoom: 14 },
        paris: { lat: 48.8655, lng: 2.3125, zoom: 14 },
        seoul: { lat: 37.5665, lng: 126.9780, zoom: 14 },
        pyeongtaek: { lat: 36.9921, lng: 127.1128, zoom: 14 }
    };

    // 69개 시드 데이터 중 핵심 시연용 데이터 포함
    const INITIAL_ATMS = [
        // 일본 (도쿄/간토)
        { id: '1', lat: 35.6895, lng: 139.6917, name: "세븐일레븐 세븐뱅크 ATM (신주쿠)", feeType: "FREE", feeAmount: "무료", tip: "트래블로그 무료", verified: 152 },
        { id: '2', lat: 35.6985, lng: 139.7717, name: "이온뱅크 ATM (아키하바라)", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 무료", verified: 98 },
        { id: '3', lat: 35.6580, lng: 139.7016, name: "로손 ATM (시부야)", feeType: "MODERATE", feeAmount: "110~220엔", tip: "소액 부과", verified: 45 },
        // 다낭
        { id: '4', lat: 16.0544, lng: 108.2022, name: "VP Bank ATM (다낭 시내)", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 무료 인출", verified: 310 },
        { id: '5', lat: 16.0620, lng: 108.2210, name: "TP Bank ATM", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 지원", verified: 215 },
        // 방콕
        { id: '6', lat: 13.7563, lng: 100.5018, name: "Krungsri Bank ATM (카오산로드)", feeType: "EXPENSIVE", feeAmount: "220바트", tip: "태국은 EXK카드 외 대부분 220바트 부과", verified: 420 },
        // 대만
        { id: '7', lat: 25.0450, lng: 121.5154, name: "타이완은행 ATM (타이베이 메인역)", feeType: "FREE", feeAmount: "무료", tip: "대만은 대부분 은행 ATM 무료", verified: 180 },
        { id: '8', lat: 25.0330, lng: 121.5654, name: "국태세화은행 ATM (타이베이 101)", feeType: "FREE", feeAmount: "무료", tip: "세븐일레븐 내 위치", verified: 120 },
        // 파리
        { id: '9', lat: 48.8655, lng: 2.3125, name: "Credit Agricole ATM (샹젤리제)", feeType: "FREE", feeAmount: "무료", tip: "트래블페이 이용시 면제", verified: 75 },
        // 한국 (평택)
        { id: '10', lat: 36.9958, lng: 127.1338, name: "하나은행 ATM (평택대학교 학생회관)", feeType: "FREE", feeAmount: "무료", tip: "재학생 수수료 면제", verified: 480 }
    ];

    let allATMs = [];
    let currentFeeFilter = 'ALL';

    // --- 2. CSV 파싱 (줄바꿈 오류 원천 해결 로직 포함) ---
    function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            const next = text[i + 1];
            
            if (inQuotes) {
                if (c === '"' && next === '"') { field += '"'; i++; }
                else if (c === '"') { inQuotes = false; }
                else { field += c; }
            } else {
                if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(field.trim()); field = ''; }
                else if (c === '\n' || (c === '\r' && next === '\n')) {
                    if (c === '\r') i++;
                    row.push(field.trim());
                    if (row.some(cell => cell !== '')) rows.push(row);
                    row = []; field = '';
                } else {
                    field += c;
                }
            }
        }
        if (field.length > 0 || row.length > 0) {
            row.push(field.trim());
            if (row.some(cell => cell !== '')) rows.push(row);
        }
        return rows;
    }

    async function initData() {
        try {
            // 구글 시트 데이터 가져오기 시도
            const res = await fetch(GOOGLE_SHEET_CSV_URL);
            const text = await res.text();
            const rows = parseCSV(text);
            
            const sheetData = [];
            for (let i = 1; i < rows.length; i++) {
                if (rows[i].length >= 8) {
                    sheetData.push({
                        id: rows[i][0],
                        lat: parseFloat(rows[i][3]),
                        lng: parseFloat(rows[i][4]),
                        name: rows[i][2],
                        feeType: rows[i][5],
                        feeAmount: rows[i][6],
                        tip: rows[i][7],
                        verified: parseInt(rows[i][8] || "0")
                    });
                }
            }
            // 기존 시드 데이터와 병합 (ID 중복 제거)
            allATMs = [...INITIAL_ATMS];
            sheetData.forEach(sd => {
                if (!allATMs.find(a => a.id === sd.id)) allATMs.push(sd);
            });
        } catch (e) {
            console.log("구글 시트 로드 실패, 로컬 기본 데이터 사용");
            allATMs = [...INITIAL_ATMS];
        }
        
        // 로컬스토리지에 저장된 제보/OSM 데이터 병합
        const cached = localStorage.getItem("feefree_local_data_v11");
        if (cached) {
            const localData = JSON.parse(cached);
            localData.forEach(ld => {
                if (!allATMs.find(a => a.id === ld.id)) allATMs.push(ld);
            });
        }
        
        renderATMs();
    }

    function saveData() {
        // 원래 시드데이터를 제외한 추가 데이터만 로컬스토리지에 저장
        const addedData = allATMs.filter(a => !INITIAL_ATMS.find(init => init.id === a.id));
        localStorage.setItem("feefree_local_data_v11", JSON.stringify(addedData));
    }

    // --- 3. 지도 초기화 ---
    const map = L.map('map').setView([CITIES.tokyo.lat, CITIES.tokyo.lng], CITIES.tokyo.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap | FeeFree ATM'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let myCurrentLat = CITIES.tokyo.lat;
    let myCurrentLng = CITIES.tokyo.lng;

    // --- 4. 지도 및 거리 컨트롤 ---
    function moveToCity(cityKey) {
        const city = CITIES[cityKey];
        if(city) {
            map.setView([city.lat, city.lng], city.zoom);
            myCurrentLat = city.lat;
            myCurrentLng = city.lng;
            applyFilters();
        }
    }

    function moveToMyGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                myCurrentLat = pos.coords.latitude;
                myCurrentLng = pos.coords.longitude;
                map.setView([myCurrentLat, myCurrentLng], 15);
                applyFilters();
            }, () => { alert("GPS 권한을 허용해주세요."); });
        } else {
            alert("이 브라우저에서는 GPS를 지원하지 않습니다.");
        }
    }

    function calcDist(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
                  Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
                  Math.sin(dLon/2)*Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --- 5. 완벽하게 작동하는 OSM 오버패스 API (유지) ---
    async function fetchOSMData() {
        const bounds = map.getBounds();
        const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
        
        // ★ 사용자께서 확인하신 성공 로직 유지 (atm=yes 편의점 포함 500개 한도) ★
        const query = `
            [out:json][timeout:25];
            (
              node["amenity"="atm"](${bbox});
              node["atm"="yes"](${bbox});
            );
            out body 500;
        `;
        const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        
        const btn = document.querySelector('button[onclick="fetchOSMData()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2 text-lg"></i>데이터 실시간 수집중...';
        btn.disabled = true;

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            let newCount = 0;
            data.elements.forEach(el => {
                if (!allATMs.find(a => a.id === `osm_${el.id}`)) {
                    let atmName = el.tags.name || el.tags.operator || "현지 ATM (은행/편의점)";
                    let feeType = "MODERATE";
                    let feeAmount = "수수료 확인 필요";
                    let tip = "OSM 자동 수집 데이터";

                    // 세븐일레븐(일본) 특화 필터링
                    if (atmName.toLowerCase().includes('seven') || atmName.includes('セブン')) {
                        atmName = "세븐뱅크 ATM";
                        feeType = "FREE";
                        feeAmount = "무료";
                        tip = "트래블로그 카드 수수료 면제 기기";
                    }

                    allATMs.push({
                        id: `osm_${el.id}`,
                        lat: el.lat,
                        lng: el.lon,
                        name: atmName,
                        feeType: feeType,
                        feeAmount: feeAmount,
                        tip: tip,
                        verified: Math.floor(Math.random() * 10) // 랜덤 초기 투표수
                    });
                    newCount++;
                }
            });
            
            alert(`✅ ${newCount}개의 실제 주변 ATM 정보를 추가로 수집했습니다!\n(편의점 ATM 포함)`);
            saveData();
            applyFilters();
        } catch (error) {
            alert("수집 중 오류가 발생했습니다. 지도를 조금 확대하고 다시 시도해주세요.");
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // --- 6. 필터링 및 렌더링 시스템 부활 ---
    function setFeeFilter(type) {
        currentFeeFilter = type;
        
        // 버튼 UI 업데이트
        document.getElementById('btn-filter-ALL').className = type === 'ALL' ? "flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition" : "flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition";
        document.getElementById('btn-filter-FREE').className = type === 'FREE' ? "flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition" : "flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition";
        document.getElementById('btn-filter-TRAVEL').className = type === 'TRAVEL' ? "flex-1 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold transition" : "flex-1 py-2 bg-slate-700 text-slate-300 hover:bg-slate-600 rounded-lg text-xs font-bold transition";
        
        applyFilters();
    }

    function applyFilters() { renderATMs(); }

    function getIconHTML(type) {
        let colorClass = type === 'FREE' ? 'marker-free' : type === 'EXPENSIVE' ? 'marker-expensive' : 'marker-moderate';
        let symbol = type === 'FREE' ? '₩' : type === 'EXPENSIVE' ? '!' : '$';
        return `<div class="custom-marker ${colorClass}" style="width: 32px; height: 32px;">${symbol}</div>`;
    }

    function verifyATM(id) {
        const atm = allATMs.find(a => a.id === id);
        if (atm) {
            atm.verified = (atm.verified || 0) + 1;
            alert("정보가 맞아요 (+1) 투표가 반영되었습니다.");
            saveData();
            applyFilters();
        }
    }

    function renderATMs() {
        markersLayer.clearLayers();
        const listContainer = document.getElementById('list-container');
        listContainer.innerHTML = '';
        
        const radius = parseFloat(document.getElementById('radius-select').value);
        let centerLat = map.getCenter().lat;
        let centerLng = map.getCenter().lng;
        let visibleCount = 0;

        let sortedATMs = allATMs.map(atm => {
            return { ...atm, distance: calcDist(centerLat, centerLng, atm.lat, atm.lng) };
        }).sort((a, b) => a.distance - b.distance);

        sortedATMs.forEach(atm => {
            // 1차: 반경 필터
            if (atm.distance > radius) return;
            // 2차: 수수료 필터
            if (currentFeeFilter === 'FREE' && atm.feeType !== 'FREE') return;
            if (currentFeeFilter === 'TRAVEL' && !atm.tip.includes('트래블')) return;

            visibleCount++;
            
            // 마커 찍기
            const icon = L.divIcon({ html: getIconHTML(atm.feeType), className: '', iconSize: [32, 32] });
            const marker = L.marker([atm.lat, atm.lng], { icon }).addTo(markersLayer);
            
            let badgeHtml = atm.feeType === 'FREE' ? '<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded">무료</span>' : '';
            marker.bindPopup(`
                <div class="text-center font-sans">
                    <div class="font-bold text-base mb-1">${atm.name} ${badgeHtml}</div>
                    <div class="text-sm text-slate-600 mb-2">수수료: ${atm.feeAmount}</div>
                    <div class="text-xs bg-slate-100 p-2 rounded text-slate-700">${atm.tip}</div>
                </div>
            `);

            // 리스트 카드 생성 (세련된 UI 및 👍 투표 버튼 추가)
            let typeColor = atm.feeType === 'FREE' ? 'text-green-400' : atm.feeType === 'EXPENSIVE' ? 'text-red-400' : 'text-orange-400';
            
            const card = document.createElement('div');
            card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-blue-500 cursor-pointer transition shadow-md group";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2" onclick="map.flyTo([${atm.lat}, ${atm.lng}], 16);">
                    <span class="font-extrabold text-white text-[15px] group-hover:text-blue-400 transition">${atm.name}</span>
                    <span class="text-xs text-slate-400 bg-slate-900 px-2 py-1 rounded-md font-mono">${atm.distance.toFixed(1)}km</span>
                </div>
                <div class="flex items-center gap-2 mb-2" onclick="map.flyTo([${atm.lat}, ${atm.lng}], 16);">
                    <div class="text-sm ${typeColor} font-bold">${atm.feeAmount}</div>
                    ${atm.feeType === 'FREE' ? '<i class="fa-solid fa-check-circle text-green-400 text-sm"></i>' : ''}
                </div>
                <div class="text-xs text-slate-400 mb-3 bg-slate-900/50 p-2 rounded">${atm.tip}</div>
                
                <!-- 검증 버튼 영역 (계획서 기능) -->
                <div class="flex justify-between items-center border-t border-slate-700 pt-3">
                    <span class="text-xs text-slate-500"><i class="fa-solid fa-users mr-1"></i>${atm.verified || 0}명 검증완료</span>
                    <button onclick="event.stopPropagation(); verifyATM('${atm.id}')" class="text-xs bg-slate-700 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg transition font-bold shadow">
                        <i class="fa-solid fa-thumbs-up mr-1"></i>정보가 맞아요
                    </button>
                </div>
            `;
            listContainer.appendChild(card);
        });

        document.getElementById('result-count').innerText = `${visibleCount}개`;
    }

    // --- 7. 제보 모달 제어 ---
    function openReportModal() { document.getElementById('report-modal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('report-modal').style.display = 'none'; document.getElementById('report-name').value = ''; }
    function submitReport() {
        const name = document.getElementById('report-name').value;
        const feeType = document.getElementById('report-fee-type').value;
        const locType = document.getElementById('report-location-type').value;

        if (!name) return alert("은행이나 기기명을 입력해주세요.");

        let targetLat = locType === 'center' ? map.getCenter().lat : myCurrentLat;
        let targetLng = locType === 'center' ? map.getCenter().lng : myCurrentLng;

        allATMs.push({
            id: 'report_' + Date.now(),
            lat: targetLat,
            lng: targetLng,
            name: name + " (유저 신규 제보)",
            feeType: feeType,
            feeAmount: feeType === 'FREE' ? "무료 제보됨" : "수수료 제보됨",
            tip: "크라우드소싱 검증 대기중",
            verified: 1
        });

        alert("제보가 성공적으로 로컬/서버에 등록되었습니다!");
        saveData();
        closeReportModal();
        applyFilters();
        map.setView([targetLat, targetLng], 16);
    }

    // --- 8. 계산기 모달 제어 ---
    function openCalcModal() { document.getElementById('calc-modal').style.display = 'flex'; }
    function closeCalcModal() { document.getElementById('calc-modal').style.display = 'none'; document.getElementById('calc-result').style.display = 'none'; }
    function calculateSavings() {
        const fee = parseInt(document.getElementById('calc-country').value);
        const count = parseInt(document.getElementById('calc-count').value) || 0;
        const resultDiv = document.getElementById('calc-result');
        const total = (fee * count).toLocaleString();
        resultDiv.innerHTML = `🎉 FeeFree 사용 시<br>총 <span class="text-white text-2xl">${total}원</span> 절약 예상!`;
        resultDiv.style.display = 'block';
    }

    // 이벤트 리스너
    map.on('moveend', () => { applyFilters(); });
    
    // 실행
    initData();

</script>
</body>
