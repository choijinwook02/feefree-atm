<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeeFree ATM - 글로벌 수수료 무료 ATM 지도</title>
    <!-- Tailwind CSS (새로운 UI 디자인) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Pretendard', sans-serif; }
        #app-container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 380px; background-color: #0f172a; color: white; display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 15px rgba(0,0,0,0.2); }
        #map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        
        /* 커스텀 스크롤바 */
        #atm-list::-webkit-scrollbar { width: 6px; }
        #atm-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* 마커 스타일 */
        .custom-marker {
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%; color: white; font-weight: bold; border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .marker-free { background-color: #22c55e; } /* 무료: 초록 */
        .marker-moderate { background-color: #f97316; } /* 소액: 주황 */
        .marker-expensive { background-color: #ef4444; } /* 고액: 빨강 */
        
        /* 모바일 대응 */
        @media (max-width: 768px) {
            #app-container { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 45vh; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); }
            #map-container { height: 55vh; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 새롭게 뜯어고친 사이드바 UI -->
    <div id="sidebar">
        <!-- 헤더 영역 -->
        <div class="p-5 border-b border-slate-700">
            <h1 class="text-2xl font-bold text-white mb-2"><i class="fa-solid fa-earth-asia text-blue-400 mr-2"></i>FeeFree ATM</h1>
            <p class="text-slate-400 text-sm mb-4">실시간 위치기반 수수료 무료 ATM 안내</p>
            
            <!-- 도시 이동 -->
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="moveToCity('tokyo')" class="px-3 py-1 bg-slate-700 hover:bg-blue-600 rounded text-sm whitespace-nowrap">🇯🇵 도쿄</button>
                <button onclick="moveToCity('danang')" class="px-3 py-1 bg-slate-700 hover:bg-blue-600 rounded text-sm whitespace-nowrap">🇻🇳 다낭</button>
                <button onclick="moveToCity('bangkok')" class="px-3 py-1 bg-slate-700 hover:bg-blue-600 rounded text-sm whitespace-nowrap">🇹🇭 방콕</button>
                <button onclick="moveToCity('taipei')" class="px-3 py-1 bg-slate-700 hover:bg-blue-600 rounded text-sm whitespace-nowrap">🇹🇼 타이베이</button>
                <button onclick="moveToCity('seoul')" class="px-3 py-1 bg-slate-700 hover:bg-blue-600 rounded text-sm whitespace-nowrap">🇰🇷 서울/평택</button>
            </div>
        </div>

        <!-- 컨트롤 패널 -->
        <div class="p-5 flex-grow flex flex-col gap-4 overflow-y-auto" id="atm-list">
            <!-- 반경 필터 -->
            <div class="flex items-center justify-between bg-slate-800 p-3 rounded-lg">
                <span class="text-sm font-semibold text-slate-300">탐색 반경</span>
                <select id="radius-select" onchange="filterATMs()" class="bg-slate-900 border border-slate-600 text-white text-sm rounded px-2 py-1 outline-none">
                    <option value="99999">화면 전체</option>
                    <option value="15">15km (시내 전체)</option>
                    <option value="5">5km</option>
                    <option value="1">1km</option>
                </select>
            </div>

            <!-- 핵심 기능 버튼 -->
            <button onclick="fetchOSMData()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg shadow-lg transition duration-200">
                <i class="fa-solid fa-satellite-dish mr-2"></i>지도 영역 ATM 전수 불러오기
            </button>

            <button onclick="openReportModal()" class="w-full py-3 border-2 border-emerald-500 text-emerald-400 hover:bg-emerald-500 hover:text-white font-bold rounded-lg transition duration-200">
                <i class="fa-solid fa-plus mr-2"></i>신규 수수료 제보하기
            </button>

            <!-- 검색 결과 텍스트 -->
            <div class="mt-4 border-t border-slate-700 pt-4">
                <h2 class="text-lg font-bold text-white mb-2">검색된 ATM 목록 <span id="result-count" class="text-blue-400 text-sm ml-2">0개</span></h2>
                <div id="list-container" class="flex flex-col gap-3">
                    <!-- 리스트 아이템 동적 생성 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 우측 풀스크린 지도 -->
    <div id="map-container">
        <!-- 상단 플로팅 배너 -->
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] flex gap-2">
            <div class="bg-yellow-400 text-black px-4 py-2 rounded-full font-bold shadow-lg whitespace-nowrap text-sm flex items-center">
                <i class="fa-solid fa-graduation-cap mr-2"></i>수업 시연 모드 작동중
            </div>
            <button onclick="moveToMyGPS()" class="bg-white text-black px-4 py-2 rounded-full font-bold shadow-lg whitespace-nowrap text-sm hover:bg-gray-100 flex items-center">
                <i class="fa-solid fa-location-crosshairs text-blue-600 mr-2"></i>내 위치
            </button>
        </div>
        <div id="map"></div>
    </div>
</div>

<!-- 제보 모달 (다크 테마) -->
<div id="report-modal" class="fixed inset-0 bg-black bg-opacity-70 z-[2000] hidden justify-center items-center">
    <div class="bg-slate-800 border border-slate-600 w-11/12 max-w-md p-6 rounded-xl shadow-2xl text-white">
        <h2 class="text-xl font-bold mb-4">ATM 수수료 제보</h2>
        
        <label class="block text-sm mb-1 text-slate-300">등록 위치 선택</label>
        <select id="report-location-type" class="w-full p-2 mb-4 bg-slate-900 border border-slate-600 rounded outline-none text-sm">
            <option value="center">현재 보고 있는 지도 중심 위치</option>
            <option value="gps">내 현재 GPS 위치</option>
        </select>

        <label class="block text-sm mb-1 text-slate-300">은행 / 기기명</label>
        <input type="text" id="report-name" placeholder="예: 세븐일레븐 ATM" class="w-full p-2 mb-4 bg-slate-900 border border-slate-600 rounded outline-none text-sm">
        
        <label class="block text-sm mb-1 text-slate-300">수수료 상태</label>
        <select id="report-fee-type" class="w-full p-2 mb-4 bg-slate-900 border border-slate-600 rounded outline-none text-sm">
            <option value="FREE">무료 (트래블카드 등)</option>
            <option value="MODERATE">소액 수수료</option>
            <option value="EXPENSIVE">고액 수수료 (주의)</option>
        </select>
        
        <div class="flex justify-end gap-2 mt-2">
            <button onclick="closeReportModal()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm font-bold">취소</button>
            <button onclick="submitReport()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-bold">등록하기</button>
        </div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- 1. 초기 데이터 셋팅 (시연용 5대국 핵심 데이터 포함) ---
    const CITIES = {
        tokyo: { lat: 35.6895, lng: 139.6917, zoom: 13 },
        danang: { lat: 16.0544, lng: 108.2022, zoom: 14 },
        bangkok: { lat: 13.7563, lng: 100.5018, zoom: 13 },
        taipei: { lat: 25.0330, lng: 121.5654, zoom: 13 },
        seoul: { lat: 37.5665, lng: 126.9780, zoom: 13 }, // 서울/평택 기준점
        pyeongtaek: { lat: 36.9921, lng: 127.1128, zoom: 14 }
    };

    let allATMs = [
        // 도쿄 초기 시드 (일부)
        { id: 'seed_t1', lat: 35.6895, lng: 139.6917, name: "세븐일레븐 ATM (신주쿠)", feeType: "FREE", feeAmount: "무료", tip: "트래블로그 무료" },
        { id: 'seed_t2', lat: 35.6985, lng: 139.7717, name: "로손 ATM (아키하바라)", feeType: "MODERATE", feeAmount: "110엔", tip: "소액 부과" },
        // 다낭 초기 시드
        { id: 'seed_d1', lat: 16.0544, lng: 108.2022, name: "VP Bank ATM", feeType: "FREE", feeAmount: "무료", tip: "트래블월렛 무료" },
        // 타이베이 초기 시드
        { id: 'seed_ta1', lat: 25.0330, lng: 121.5654, name: "국태세화은행 ATM", feeType: "FREE", feeAmount: "무료", tip: "타이베이 101 근처" },
        { id: 'seed_ta2', lat: 25.0450, lng: 121.5154, name: "대만은행 ATM", feeType: "FREE", feeAmount: "무료", tip: "타이베이 메인역" },
        // 평택대학교 초기 시드
        { id: 'seed_p1', lat: 36.9958, lng: 127.1338, name: "하나은행 ATM (평택대 학생회관)", feeType: "FREE", feeAmount: "무료", tip: "재학생 면제" }
    ];

    // --- 2. 지도 초기화 ---
    const map = L.map('map').setView([CITIES.tokyo.lat, CITIES.tokyo.lng], CITIES.tokyo.zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap | FeeFree ATM'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let myCurrentLat = CITIES.tokyo.lat;
    let myCurrentLng = CITIES.tokyo.lng;

    // --- 3. UI 및 지도 컨트롤 함수 ---
    function moveToCity(cityKey) {
        const city = CITIES[cityKey];
        if(city) {
            map.setView([city.lat, city.lng], city.zoom);
            myCurrentLat = city.lat;
            myCurrentLng = city.lng;
            renderATMs();
        }
    }

    function moveToMyGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                myCurrentLat = pos.coords.latitude;
                myCurrentLng = pos.coords.longitude;
                map.setView([myCurrentLat, myCurrentLng], 15);
                renderATMs();
            }, () => { alert("GPS 권한을 허용해주세요."); });
        } else {
            alert("이 브라우저에서는 GPS를 지원하지 않습니다.");
        }
    }

    // 직선거리 계산 (Haversine)
    function calcDist(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
                  Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
                  Math.sin(dLon/2)*Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --- 4. OSM 오버패스 API 전수 수집 (문제 완벽 해결) ---
    async function fetchOSMData() {
        const bounds = map.getBounds();
        // 화면 바운딩 박스 생성 (남, 서, 북, 동)
        const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
        
        // ★ 핵심 수정: amenity=atm 뿐만 아니라 atm=yes(일본 편의점)까지 500개 한도로 수집 ★
        const query = `
            [out:json][timeout:25];
            (
              node["amenity"="atm"](${bbox});
              node["atm"="yes"](${bbox});
            );
            out body 500;
        `;
        
        const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        
        // 버튼 상태 변경
        const btn = document.querySelector('button[onclick="fetchOSMData()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>수백 개의 ATM 수집중...';
        btn.disabled = true;

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            let newCount = 0;
            data.elements.forEach(el => {
                // 중복 방지 (id로 체크)
                if (!allATMs.find(a => a.id === `osm_${el.id}`)) {
                    let atmName = el.tags.name || el.tags.operator || "현지 ATM (편의점/은행)";
                    let feeType = "MODERATE"; // OSM 기본은 알수없음(소액) 처리
                    
                    // 세븐일레븐 등 특정 키워드에 따라 무료 판정 (일본 시연용)
                    if (atmName.toLowerCase().includes('seven') || atmName.includes('セブン')) {
                        atmName = "세븐뱅크 ATM (트래블로그 무료)";
                        feeType = "FREE";
                    }

                    allATMs.push({
                        id: `osm_${el.id}`,
                        lat: el.lat,
                        lng: el.lon,
                        name: atmName,
                        feeType: feeType,
                        feeAmount: feeType === "FREE" ? "수수료 없음" : "수수료 확인 필요",
                        tip: "OSM 자동 수집 데이터"
                    });
                    newCount++;
                }
            });
            
            alert(`✅ ${newCount}개의 실제 주변 ATM 정보를 추가로 수집했습니다!\n(일본 편의점 ATM 포함)`);
            renderATMs();
        } catch (error) {
            alert("데이터를 불러오는 중 오류가 발생했습니다. 지도를 조금 확대하고 다시 시도해주세요.");
            console.error(error);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // --- 5. 지도에 마커 및 리스트 렌더링 ---
    function getIconHTML(type) {
        let colorClass = type === 'FREE' ? 'marker-free' : type === 'EXPENSIVE' ? 'marker-expensive' : 'marker-moderate';
        let symbol = type === 'FREE' ? '₩' : type === 'EXPENSIVE' ? '!' : '$';
        return `<div class="custom-marker ${colorClass}" style="width: 30px; height: 30px;">${symbol}</div>`;
    }

    function renderATMs() {
        markersLayer.clearLayers();
        const listContainer = document.getElementById('list-container');
        listContainer.innerHTML = '';
        
        const radius = parseFloat(document.getElementById('radius-select').value);
        let visibleCount = 0;

        // 현재 지도 중심(또는 내 위치) 기준으로 거리순 정렬
        let centerLat = map.getCenter().lat;
        let centerLng = map.getCenter().lng;

        let sortedATMs = allATMs.map(atm => {
            return { ...atm, distance: calcDist(centerLat, centerLng, atm.lat, atm.lng) };
        }).sort((a, b) => a.distance - b.distance);

        sortedATMs.forEach(atm => {
            // 반경 필터링
            if (atm.distance <= radius) {
                visibleCount++;
                
                // 마커 찍기
                const icon = L.divIcon({ html: getIconHTML(atm.feeType), className: '', iconSize: [30, 30] });
                const marker = L.marker([atm.lat, atm.lng], { icon }).addTo(markersLayer);
                marker.bindPopup(`<b>${atm.name}</b><br/>수수료: ${atm.feeAmount}<br/>${atm.tip}`);

                // 리스트 추가
                let typeColor = atm.feeType === 'FREE' ? 'text-green-400' : atm.feeType === 'EXPENSIVE' ? 'text-red-400' : 'text-orange-400';
                
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-3 rounded border border-slate-700 hover:border-blue-500 cursor-pointer transition";
                card.onclick = () => {
                    map.flyTo([atm.lat, atm.lng], 16);
                    marker.openPopup();
                };
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-slate-100 text-sm">${atm.name}</span>
                        <span class="text-xs text-slate-400">${atm.distance.toFixed(1)}km</span>
                    </div>
                    <div class="text-xs ${typeColor} font-bold mb-1">${atm.feeAmount}</div>
                    <div class="text-xs text-slate-400 truncate">${atm.tip}</div>
                `;
                listContainer.appendChild(card);
            }
        });

        document.getElementById('result-count').innerText = `${visibleCount}개`;
    }

    // --- 6. 제보 모달 기능 ---
    function openReportModal() {
        document.getElementById('report-modal').style.display = 'flex';
    }
    function closeReportModal() {
        document.getElementById('report-modal').style.display = 'none';
        document.getElementById('report-name').value = '';
    }
    function submitReport() {
        const name = document.getElementById('report-name').value;
        const feeType = document.getElementById('report-fee-type').value;
        const locType = document.getElementById('report-location-type').value;

        if (!name) return alert("은행이나 기기명을 입력해주세요.");

        let targetLat, targetLng;
        if (locType === 'center') {
            targetLat = map.getCenter().lat;
            targetLng = map.getCenter().lng;
        } else {
            targetLat = myCurrentLat;
            targetLng = myCurrentLng;
        }

        const newId = 'report_' + Date.now();
        allATMs.push({
            id: newId,
            lat: targetLat,
            lng: targetLng,
            name: name + " (유저 제보)",
            feeType: feeType,
            feeAmount: feeType === 'FREE' ? "무료 제보됨" : "수수료 제보됨",
            tip: "크라우드소싱 검증 대기중"
        });

        alert("제보가 성공적으로 등록되었습니다!");
        closeReportModal();
        renderATMs();
        map.setView([targetLat, targetLng], 16);
    }

    // 필터 변경 시 재렌더링 이벤트 연결
    function filterATMs() { renderATMs(); }

    // 지도 이동 시 리스트 거리 업데이트
    map.on('moveend', () => { renderATMs(); });

    // 초기 렌더링
    renderATMs();

</script>
</body>
</html>
