<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeeFree ATM - 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Pretendard', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#1e293b] border border-gray-700 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/20 border border-blue-500/40 mb-3">
                <i class="fa-solid fa-earth-asia text-blue-400 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">FeeFree ATM</h1>
            <p class="text-xs text-gray-400 mt-1">실시간 GPS 위치기반 글로벌 수수료 무료 ATM 지도</p>
        </div>

        <div class="flex bg-[#0f172a] p-1 rounded-xl border border-gray-700 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-blue-600 text-white">로그인</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white">회원가입</button>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-500/40 text-red-300 text-xs font-bold flex items-center">
            <i class="fa-solid fa-circle-exclamation mr-2"></i>{{ error }}
        </div>
        {% endif %}

        <form id="form-login" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">아이디</label>
                <input type="text" name="username" required placeholder="아이디를 입력하세요"
                    class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-gray-600 rounded-lg text-sm outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">비밀번호</label>
                <input type="password" name="password" required placeholder="비밀번호를 입력하세요"
                    class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-gray-600 rounded-lg text-sm outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-sm transition shadow-lg">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>지도 서비스 입장하기
            </button>
            <div class="mt-4 p-3 rounded-lg bg-[#0f172a]/70 border border-gray-700 text-[11px] text-gray-400 space-y-1 text-center">
                <div>관리자 계정: <span class="text-blue-400 font-bold">admin</span> / <span class="text-blue-400 font-bold">1234</span></div>
                <div>일반 회원 계정: <span class="text-emerald-400 font-bold">user1</span> / <span class="text-emerald-400 font-bold">1234</span></div>
            </div>
        </form>

        <form id="form-register" action="/register" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">아이디</label>
                <input type="text" name="username" required placeholder="사용할 아이디"
                    class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-gray-600 rounded-lg text-sm outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">닉네임</label>
                <input type="text" name="nickname" required placeholder="예: 진욱"
                    class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-gray-600 rounded-lg text-sm outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">주 사용 트래블카드</label>
                <select name="preferred_card" class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-gray-600 rounded-lg text-sm outline-none focus:border-emerald-500">
                    <option value="트래블로그">하나 트래블로그</option>
                    <option value="트래블월렛">트래블월렛</option>
                    <option value="신한 SOL트래블">신한 SOL트래블</option>
                    <option value="토스뱅크 외화통장">토스뱅크 외화통장</option>
                    <option value="KB 트래블러스">KB 트래블러스</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">비밀번호</label>
                <input type="password" name="password" required placeholder="비밀번호 입력"
                    class="w-full px-3.5 py-2.5 bg-[#0f172a] border border-gray-600 rounded-lg text-sm outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-sm transition shadow-lg">
                <i class="fa-solid fa-user-plus mr-2"></i>가입하고 바로 시작하기
            </button>
        </form>
    </div>

    <script>
        function switchTab(mode) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            if (mode === 'register') {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 py-2 rounded-lg text-xs font-bold transition bg-emerald-600 text-white";
                tabLogin.className = "flex-1 py-2 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white";
            } else {
                regForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                tabLogin.className = "flex-1 py-2 rounded-lg text-xs font-bold transition bg-blue-600 text-white";
                tabReg.className = "flex-1 py-2 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white";
            }
        }
        {% if mode == 'register' %}switchTab('register');{% endif %}
    </script>
</body>
</html>
